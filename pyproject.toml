[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qiandao"
version = "2.0.0"
description = "一个 Docker 部署的 curl 自动签到管理工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "tzdata",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
